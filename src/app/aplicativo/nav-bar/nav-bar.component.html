<div class="navbar">
    <div class="logo-section" (click)="selectPhase('fase1')">
       <img src="assets/img/logo.png" class="img-navbar" alt="Logo Zodiaco" />
       <span class="logo-title">Zodiaco</span>
    </div>
    <ul class="nav-links">
        @for (item of navItems; track item.id) {
            <li>
                <a 
                  href="javascript:void(0)" 
                  [class.active]="item.id === activePhase"
                  [class.disabled-phase]="!isEnabled(item.id)"
                  [title]="!isEnabled(item.id) ? 'No disponible aún' : item.nombre"
                  (click)="selectPhase(item.id)"
                >
                  {{ item.nombre }}
                  @if (!isEnabled(item.id)) {
                    <span class="lock-icon">🔒</span>
                  }
                </a>
            </li>
        }
    </ul>
</div>
